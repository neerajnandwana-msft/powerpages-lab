# Vale config: Microsoft Writing Style Guide enforcement for the lab docs.
# The mechanical sweep (scripts/ms-learn-style-sweep.mjs) handles
# sentence-case headings and a few word swaps. Vale covers the rest of the
# Microsoft style: passive voice, wordiness, terminology, spelling, and em dashes.
#
# First run downloads the Microsoft package: `npm run lint:prose` (runs
# `vale sync` then `vale docs`). Requires the Vale binary on PATH
# (winget install errata-ai.Vale  /  brew install vale).

StylesPath = .vale/styles
MinAlertLevel = warning

# Downloaded by `vale sync` into StylesPath.
Packages = Microsoft

# Project vocabulary — brand names and acronyms Vale must not flag as spelling
# errors. Keep in sync with PRESERVE_CASE in scripts/ms-learn-style-sweep.{mjs,py}.
Vocab = PowerPages

[*.md]
BasedOnStyles = Vale, Microsoft

# The mechanical sweep sentence-cases H2-H4 headings and deliberately exempts
# H1/page titles, so disable Microsoft.Headings here to avoid double-flagging.
# Microsoft.Dashes stays ON: this content uses no em dashes, and Vale flags any
# that slip in (use a colon, comma, parentheses, or separate sentences).
Microsoft.Headings = NO

# Docusaurus admonition keywords and frontmatter shouldn't be spell-checked as prose.
BlockIgnores = (?s) *(:::.*?:::)
